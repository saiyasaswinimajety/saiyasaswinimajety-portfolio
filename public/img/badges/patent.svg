<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="pat-bg" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="85%" stop-color="#091227"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>

    <!-- Gold Foil Gradient -->
    <linearGradient id="pat-gold" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="25%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="75%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>

    <!-- Cyan Glow Gradient -->
    <linearGradient id="pat-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#18BC9C"/>
    </linearGradient>

    <!-- Ribbon Gradient -->
    <linearGradient id="pat-ribbon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="40%" stop-color="#EF4444"/>
      <stop offset="70%" stop-color="#B91C1C"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>

    <!-- Filter for soft glow -->
    <filter id="pat-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Hanging Ribbons (Behind Badge) -->
  <g>
    <!-- Left Ribbon -->
    <path d="M42 78L32 114L48 106L56 86Z" fill="url(#pat-ribbon)" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.5))"/>
    <path d="M42 78L32 114L38 100Z" fill="#7F1D1D" opacity="0.6"/>
    <!-- Right Ribbon -->
    <path d="M78 78L88 114L72 106L64 86Z" fill="url(#pat-ribbon)" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.5))"/>
    <path d="M78 78L88 114L82 100Z" fill="#991B1B" opacity="0.6"/>
  </g>

  <!-- Outer Starburst / Seal Teeth -->
  <circle cx="60" cy="54" r="48" fill="url(#pat-gold)" filter="drop-shadow(0 6px 14px rgba(0,0,0,0.6))"/>
  
  <!-- Outer Ring Teeth (Rotated Dots for Official Seal) -->
  <g stroke="#92400E" stroke-width="1.5" stroke-dasharray="2 3">
    <circle cx="60" cy="54" r="45" fill="none"/>
  </g>

  <!-- Inner Plate (Deep Obsidian Tech Background) -->
  <circle cx="60" cy="54" r="42" fill="url(#pat-bg)" stroke="url(#pat-gold)" stroke-width="2.5"/>

  <!-- Delicate Concentric Ring with Tick Marks -->
  <circle cx="60" cy="54" r="36" fill="none" stroke="#FDE68A" stroke-width="0.8" opacity="0.4"/>
  <circle cx="60" cy="54" r="32" fill="none" stroke="url(#pat-cyan)" stroke-width="1.2" opacity="0.7"/>

  <!-- Official Patent Inscription Arc / Mini Stars -->
  <g fill="#FBBF24" opacity="0.9">
    <!-- Top 3 Stars -->
    <polygon points="60,25 61.2,28.5 64.8,28.5 61.9,30.6 63,34.1 60,32 57,34.1 58.1,30.6 55.2,28.5 58.8,28.5" transform="scale(0.7) translate(25.7, 9)"/>
    <circle cx="50" cy="27" r="1.2"/>
    <circle cx="70" cy="27" r="1.2"/>
    <circle cx="42" cy="31" r="1"/>
    <circle cx="78" cy="31" r="1"/>
  </g>

  <!-- Center Core: Neural Network / Deep Learning Brain Architecture (Patent Focus) -->
  <g>
    <!-- Neural Synapse Connections -->
    <path d="M45 46L60 38L75 46L70 64L50 64Z" stroke="url(#pat-cyan)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
    <path d="M45 46L60 55L75 46" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/>
    <path d="M50 64L60 55L70 64" stroke="#18BC9C" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/>
    <path d="M60 38L60 55" stroke="#FDE68A" stroke-width="2" stroke-linecap="round"/>

    <!-- Neural Nodes (Pulsing Centers) -->
    <!-- Top Apex Node (Input) -->
    <circle cx="60" cy="38" r="4" fill="url(#pat-gold)" stroke="#FFF" stroke-width="1"/>
    <circle cx="60" cy="38" r="1.5" fill="#FFF"/>

    <!-- Left Intermediate Node -->
    <circle cx="45" cy="46" r="3.5" fill="#38BDF8" stroke="#0F172A" stroke-width="1"/>
    <circle cx="45" cy="46" r="1.2" fill="#FFF"/>

    <!-- Right Intermediate Node -->
    <circle cx="75" cy="46" r="3.5" fill="#38BDF8" stroke="#0F172A" stroke-width="1"/>
    <circle cx="75" cy="46" r="1.2" fill="#FFF"/>

    <!-- Center Latent Adapter Node (Dynamic Routing) -->
    <circle cx="60" cy="55" r="5" fill="#18BC9C" stroke="#FDE68A" stroke-width="1.5" filter="url(#pat-glow)"/>
    <circle cx="60" cy="55" r="2" fill="#FFFFFF"/>

    <!-- Bottom Left Output Node -->
    <circle cx="50" cy="64" r="3.2" fill="url(#pat-gold)" stroke="#0F172A" stroke-width="1"/>

    <!-- Bottom Right Output Node -->
    <circle cx="70" cy="64" r="3.2" fill="url(#pat-gold)" stroke="#0F172A" stroke-width="1"/>
  </g>

  <!-- Bottom Official Banner Pill: "PATENT" -->
  <g filter="drop-shadow(0 2px 4px rgba(0,0,0,0.6))">
    <rect x="34" y="70" width="52" height="15" rx="7.5" fill="url(#pat-gold)" stroke="#78350F" stroke-width="1"/>
    <rect x="36" y="72" width="48" height="11" rx="5.5" fill="#091227"/>
    <text x="60" y="80.5" fill="#FDE68A" font-family="'Montserrat', 'Arial Black', sans-serif" font-size="7.5" font-weight="900" text-anchor="middle" letter-spacing="1.2">PATENT</text>
  </g>
</svg>
