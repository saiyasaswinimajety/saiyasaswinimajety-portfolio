<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <radialGradient id="tro-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#091227"/>
    </radialGradient>
    <linearGradient id="tro-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="tro-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#18BC9C"/>
    </linearGradient>
  </defs>
  <circle cx="60" cy="60" r="50" fill="url(#tro-bg)" stroke="url(#tro-gold)" stroke-width="3" filter="drop-shadow(0 6px 12px rgba(0,0,0,0.5))"/>
  <circle cx="60" cy="60" r="44" fill="none" stroke="url(#tro-cyan)" stroke-width="1" opacity="0.5"/>

  <!-- Trophy Cup Body -->
  <path d="M42 34H78V52C78 62 70 70 60 70C50 70 42 62 42 52V34Z" fill="url(#tro-gold)" stroke="#92400E" stroke-width="1"/>
  <!-- Cup Interior Rim -->
  <ellipse cx="60" cy="34" rx="18" ry="4" fill="#FDE68A"/>

  <!-- Handles -->
  <path d="M42 38C30 38 30 54 42 58" stroke="url(#tro-gold)" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <path d="M78 38C90 38 90 54 78 58" stroke="url(#tro-gold)" stroke-width="3.5" stroke-linecap="round" fill="none"/>

  <!-- Stem & Pedestal -->
  <path d="M56 70H64V80H56Z" fill="url(#tro-gold)"/>
  <path d="M48 80H72L75 88H45L48 80Z" fill="url(#tro-gold)" stroke="#92400E" stroke-width="1"/>

  <!-- Number 1 on cup -->
  <text x="60" y="57" fill="#091227" font-family="'Montserrat', sans-serif" font-size="16" font-weight="900" text-anchor="middle">1</text>
  
  <!-- Banner: 1ST PLACE -->
  <rect x="32" y="92" width="56" height="13" rx="6.5" fill="url(#tro-gold)"/>
  <rect x="34" y="94" width="52" height="9" rx="4.5" fill="#091227"/>
  <text x="60" y="101" fill="#FDE68A" font-family="'Montserrat', sans-serif" font-size="6.5" font-weight="900" text-anchor="middle" letter-spacing="1">1ST PLACE</text>
</svg>