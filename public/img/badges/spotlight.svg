<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <radialGradient id="sec-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#091227"/>
    </radialGradient>
    <linearGradient id="sec-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#18BC9C"/>
    </linearGradient>
  </defs>
  <circle cx="60" cy="60" r="50" fill="url(#sec-bg)" stroke="url(#sec-cyan)" stroke-width="3" filter="drop-shadow(0 6px 12px rgba(0,0,0,0.5))"/>
  
  <!-- Security Shield Outer -->
  <path d="M60 28L82 36V54C82 70 60 84 60 84C60 84 38 70 38 54V36L60 28Z" fill="url(#sec-cyan)" opacity="0.2" stroke="url(#sec-cyan)" stroke-width="2.5" stroke-linejoin="round"/>
  
  <!-- Inner Shield -->
  <path d="M60 34L76 40V53C76 65 60 76 60 76C60 76 44 65 44 53V40L60 34Z" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>

  <!-- Padlock in Center -->
  <!-- Shackle -->
  <path d="M53 52V47C53 43.1 56.1 40 60 40C63.9 40 67 43.1 67 47V52" stroke="#FDE68A" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Lock Body -->
  <rect x="49" y="52" width="22" height="16" rx="4" fill="#F59E0B" stroke="#B45309" stroke-width="1"/>
  <!-- Keyhole -->
  <circle cx="60" cy="58" r="2" fill="#091227"/>
  <polygon points="59,58 61,58 61.5,63 58.5,63" fill="#091227"/>

  <!-- Banner: TLS/SSL -->
  <rect x="34" y="90" width="52" height="13" rx="6.5" fill="url(#sec-cyan)"/>
  <rect x="36" y="92" width="48" height="9" rx="4.5" fill="#091227"/>
  <text x="60" y="99" fill="#38BDF8" font-family="'Montserrat', sans-serif" font-size="6.5" font-weight="900" text-anchor="middle" letter-spacing="1">SECURITY</text>
</svg>