<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <radialGradient id="sch-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#091227"/>
    </radialGradient>
    <linearGradient id="sch-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
  </defs>
  <!-- Base Shield / Medallion -->
  <circle cx="60" cy="60" r="50" fill="url(#sch-bg)" stroke="url(#sch-gold)" stroke-width="3" filter="drop-shadow(0 6px 12px rgba(0,0,0,0.5))"/>
  <circle cx="60" cy="60" r="44" fill="none" stroke="#FBBF24" stroke-width="1" stroke-dasharray="3 3" opacity="0.6"/>
  
  <!-- Laurel Wreath -->
  <g stroke="#F59E0B" stroke-width="1.5" fill="none" opacity="0.75">
    <path d="M32 68C30 52 38 40 46 34"/>
    <path d="M88 68C90 52 82 40 74 34"/>
    <circle cx="34" cy="48" r="2" fill="#FBBF24"/>
    <circle cx="40" cy="38" r="2" fill="#FBBF24"/>
    <circle cx="86" cy="48" r="2" fill="#FBBF24"/>
    <circle cx="80" cy="38" r="2" fill="#FBBF24"/>
  </g>

  <!-- Mortarboard Cap & Scroll -->
  <!-- Cap Diamond Top -->
  <polygon points="60,34 84,46 60,56 36,46" fill="url(#sch-gold)" stroke="#92400E" stroke-width="1"/>
  <polygon points="60,37 80,46 60,54 40,46" fill="#0F172A"/>
  <!-- Cap Skull Base -->
  <path d="M48 53V63C48 66 54 69 60 69C66 69 72 66 72 63V53" fill="url(#sch-gold)" opacity="0.9"/>
  <!-- Tassel -->
  <path d="M60 46L38 52V62" stroke="#FDE68A" stroke-width="2" stroke-linecap="round"/>
  <circle cx="38" cy="63" r="2" fill="#FDE68A"/>

  <!-- Diploma Scroll below -->
  <rect x="44" y="75" width="32" height="8" rx="4" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1"/>
  <rect x="56" y="73" width="8" height="12" rx="2" fill="#DC2626"/>
  
  <!-- Banner Label -->
  <rect x="36" y="88" width="48" height="13" rx="6.5" fill="url(#sch-gold)"/>
  <rect x="38" y="90" width="44" height="9" rx="4.5" fill="#091227"/>
  <text x="60" y="97" fill="#FDE68A" font-family="'Montserrat', sans-serif" font-size="6.5" font-weight="800" text-anchor="middle" letter-spacing="1">TOP 3%</text>
</svg>